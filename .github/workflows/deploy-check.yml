# Deploy gate (S0.1). Work is pushed to wordpress-dev. This job lints every PHP file, boots WordPress with the
# themes and plugins, adds one item of each kind, and loads one URL per page type. Any PHP fatal, 500 or
# "critical error" fails the job. Only when it passes is the wordpress branch (which Hostinger deploys) moved to
# the tested commit.
# On a pull request into wordpress-dev (owner, 24 Oct 2026) the same checks run and nothing else: no tag, no push, no
# deploy. The live-site picture check is skipped there (it reads the live site, not the PR). Make this job's "check"
# status required in the branch rules so a PR cannot merge until it passes.
name: Deploy check

on:
  push:
    branches: [wordpress-dev]
  pull_request:
    branches: [wordpress-dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-check-pr-{0}', github.event.pull_request.number) || 'deploy-check' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, intl, zip
          tools: wp-cli
      - name: WP-CLI (installed from its release if setup-php could not)
        run: |
          command -v wp || { sudo curl -sSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.11.0/wp-cli-2.11.0.phar && sudo chmod +x /usr/local/bin/wp; }
          wp --version --allow-root
      - name: PHP lint (all files)
        run: |
          find plugins themes tools -name '*.php' -print0 | xargs -0 -n1 -P4 php -l | grep -v '^No syntax errors' && exit 1 || true
      - name: Kits registry (every component, block and pattern has an entry)
        run: python3 tools/ci/registry_check.py
      - name: Footer height follows its content (no max-height, vh height or overflow hidden)
        run: python3 tools/ci/footer_check.py
      - name: Breakpoints only 767/768 and 1199/1200 (media queries and matchMedia)
        run: python3 tools/ci/breakpoint_check.py
      - name: Colour contrast (text 4.5:1, non-text 3:1; every campaign palette)
        run: python3 tools/ci/contrast_check.py
      - name: No picture used twice on the live site
        if: github.event_name != 'pull_request'
        run: python3 tools/ci/thumb_check.py
      - name: Boot WordPress and load every page type
        run: bash tools/ci/smoke.sh
      - name: Move the deploy branch to this commit, and mark it as a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/wordpress-dev'
        run: |
          # Each deploy is a release tag; the last 5 are kept for one-command rollback (rollback.yml).
          # Branch and tag go in one push: a separate tag push straight after the branch was sometimes rejected
          # ("missing necessary objects"), leaving the release without its rollback tag.
          tag="release-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          git tag "$tag"
          git push origin "HEAD:refs/heads/wordpress" "refs/tags/$tag"
          git fetch --tags --force
          git tag -l 'release-*' --sort=-creatordate | tail -n +6 | while read t; do git push origin ":refs/tags/$t"; done
      - name: Nudge the site so it purges its page cache once Hostinger has pulled this commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/wordpress-dev'
        run: |
          # Cached pages never run PHP, so the deploy-purge hook (animal-writes-core deploy-purge.php) needs one uncached
          # request after the pull: the home page with a query string nobody else uses is a cache miss and a full page
          # render, whose response carries LiteSpeed's purge header (the hook marks it not cacheable). It purges once.
          # Hostinger usually pulls within 2 minutes: ask every 30 s for 5 minutes (a request does nothing once purged).
          for i in $(seq 1 10); do
            sleep 30
            curl -s -o /dev/null -m 20 -w "%{http_code} " "https://animalwrites.in/?aw_deploy_nudge=$(git rev-parse --short HEAD)-$i" || true
          done
          echo
